# Type-checks, lints and builds every push and pull request.
#
# The build is the part that matters: `next build` is where a bad import, a
# server-only module reaching a client component, or a route that cannot be
# statically analysed actually shows up. Types and lint are cheap enough to run
# alongside it and catch the same class of mistake sooner.
#
# Only the public Supabase values are given to the build. The content loaders
# fall back to the shipped defaults when Postgres cannot answer, so a build with
# no secret key still produces a correct bundle — and CI never needs to hold a
# credential that bypasses row level security.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # Defaulted rather than required, so a fork with no secrets configured
          # still gets a green build.
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://officepigeon.com' }}
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: 'true'
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: npm run build
