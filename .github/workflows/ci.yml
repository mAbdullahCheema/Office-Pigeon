name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip the postinstall prod build during install; we build explicitly below.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
