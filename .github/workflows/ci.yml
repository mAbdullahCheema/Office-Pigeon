name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Use `npm install` (not `npm ci`): the committed lockfile drifts on
      # optional platform binaries, which makes `npm ci`'s strict check fail.
      # `npm install` provisions the correct native binaries and its
      # `postinstall` runs the real prod build (vite + copyPreviews + esbuild),
      # mirroring how Hostinger deploys — so CI fails the same way prod would.
      - name: Install + build (via postinstall)
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint
